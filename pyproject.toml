[project]
name = "parsingapplication"
version = "0.1.0"
description = "Resume and job description matching application"
readme = "README.md"
authors = [
    { name = "rohit9420", email = "rohitmoriya499@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "groq>=1.7.0",
    "pydantic>=2.14.1",
    "pypdf>=6.21.2",
    "python-dotenv>=1.2.4",
    "python-docx>=1.1.2",
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
    "streamlit>=1.67.0",
    "requests>=2.34.2",
    "python-multipart>=0.0.34",
]

[project.scripts]
parsingapplication = "parsingapplication:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
